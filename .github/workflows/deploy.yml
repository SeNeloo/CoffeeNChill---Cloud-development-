name: CoffeeNChill Docker Deployment Pipeline

on:
  push:
    branches:
      - part3-api-gateway
      - main
      - master

  pull_request:
    branches:
      - part3-api-gateway
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Functions Image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill
          file: ./CoffeeNChill/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: neloo/coffeenchill-functions:latest

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: ./CoffeeNChill.Gateway
          file: ./CoffeeNChill.Gateway/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: neloo/coffeenchill-gateway:latest
