name: CoffeeNChill Docker Deployment Pipeline

on:
  push:
    branches:
      - part3-api-gateway
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Functions Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./CoffeeNChill/Dockerfile
          push: true
          tags: neloo/coffeenchill-functions:latest

      - name: Build and Push Gateway Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./CoffeeNChill.Gateway/Dockerfile
          push: true
          tags: neloo/coffeenchill-gateway:latest
